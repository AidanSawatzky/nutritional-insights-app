name: Azure Static Web Apps CI/CD
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.a0e61cc15af9d6a5a4e13d08f53cf1b7455ead390f383e54cba952020b27e76d07-aa3cc6fa-48ac-473a-846e-7cef0f2bf28800f05200c1c5570f }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/dashboard-app"
          output_location: ""